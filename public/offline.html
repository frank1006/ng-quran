<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuranFlow - Offline</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff9f0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #fff9f0 0%, #ffffff 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1f1f1f;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    .offline-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, rgba(255, 176, 48, 0.15) 0%, rgba(255, 176, 48, 0.25) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #874d14;
      box-shadow: 0 8px 24px rgba(135, 77, 20, 0.15);
    }
    
    .offline-icon svg {
      width: 64px;
      height: 64px;
    }
    
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #874d14;
      margin-bottom: 1rem;
      letter-spacing: -0.02rem;
    }
    
    .description {
      font-size: 1rem;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 0.5rem;
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
    }
    
    .sub-description {
      font-size: 0.875rem;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 28rem;
      margin-left: auto;
      margin-right: auto;
    }
    
    .retry-button {
      margin-top: var(--space-md);
      padding: var(--space-sm) var(--space-lg);
      background: #ffb030;
      color: #1f1f1f;
      border: 2px solid #ffb030;
      border-radius: var(--radius-lg);
      font-family: 'Poppins', sans-serif;
      font-size: var(--font-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 12px rgba(255, 176, 48, 0.25);
      letter-spacing: var(--letter-spacing-xs);
    }
    
    .retry-button:hover {
      background: #ff9900;
      border-color: #ff9900;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 176, 48, 0.35);
    }
    
    .retry-button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(255, 176, 48, 0.25);
    }
    
    @media (max-width: 30rem) {
      .offline-icon {
        width: 100px;
        height: 100px;
        margin-bottom: 1.5rem;
      }
      
      .offline-icon svg {
        width: 52px;
        height: 52px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      .description {
        font-size: 0.9375rem;
      }
      
      .sub-description {
        font-size: 0.8125rem;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      </svg>
    </div>
    <h1>No Internet Connection</h1>
    <p class="description">We couldn't connect to the internet. Please check your connection and try again.</p>
    <p class="sub-description">Don't worry, some features may still work with cached content while you're offline.</p>
    <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
  </div>
  
  <script>
    // Try to reload when connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
