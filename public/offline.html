<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Quran App - Offline</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff9f0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #fff9f0 0%, #ffffff 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #1f1f1f;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    
    .offline-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: rgba(255, 176, 48, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #874d14;
    }
    
    .offline-icon svg {
      width: 40px;
      height: 40px;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #874d14;
      margin-bottom: 1rem;
    }
    
    p {
      font-size: 1rem;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    .retry-button {
      padding: 0.75rem 2rem;
      background: #ffb030;
      color: #1f1f1f;
      border: none;
      border-radius: 1.5rem;
      font-family: 'Poppins', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .retry-button:hover {
      background: #ff9900;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255, 176, 48, 0.3);
    }
    
    .retry-button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Please check your internet connection. The app will work with cached content once you're back online.</p>
    <button class="retry-button" onclick="window.location.reload()">Try Again</button>
  </div>
  
  <script>
    // Try to reload when connection is restored
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
