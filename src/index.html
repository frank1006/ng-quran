<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuranFlow — Prayer Times, Quran &amp; Qibla</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#fff9f0">
  <meta name="description" content="Accurate prayer times, nearby masjids, Quran reading with audio, and Qibla direction. Free, private and works offline.">
  <meta property="og:title" content="QuranFlow — Prayer Times, Quran &amp; Qibla">
  <meta property="og:description" content="Accurate prayer times, nearby masjids, Quran reading with audio, and Qibla direction. Free, private and works offline.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://qflowai.jahaznova.com/">
  <meta property="og:image" content="https://qflowai.jahaznova.com/icons/icon-512x512.png">
  <meta name="twitter:card" content="summary">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuranFlow">
  
  <!-- Icons and Manifest -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">
  
  <!-- Installed Android app: Android shows its own launch screen (icon on the manifest's
       background) while it starts, so ours stays empty: no second logo flashing by.
       Runs before the first paint; src/main.ts reads the class too. -->
  <script>
    if (/Android/i.test(navigator.userAgent) &&
        (document.referrer.indexOf('android-app://') === 0 ||
         matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches)) {
      document.documentElement.classList.add('android-app');
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>
<body>
  <!-- The launch screen: covers the app while it starts and stays at least a moment on a fresh
       start (src/main.ts removes it). It's also what tools that don't run the app see, such as
       Google's sign-in branding check: the app's name, what it does, the privacy policy -->
  <main class="boot" id="boot">
    <div class="boot-brand">
      <img class="boot-logo" src="icons/icon-192x192.png" width="112" height="112" alt="">
      <h1 class="boot-name">QuranFlow</h1>
      <p class="boot-tagline">Prayer · Quran · Qibla · AI</p>
      <p class="boot-text">Prayer times, the Quran with audio, Qibla direction, nearby masjids and QuranFlow AI.</p>
    </div>
    <p class="boot-links"><a href="/mission">About QuranFlow</a> · <a href="/privacy">Privacy policy</a></p>
  </main>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
