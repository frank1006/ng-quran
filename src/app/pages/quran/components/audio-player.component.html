<div class="audio-player" [class.collapsed]="!visible()">
  @if (visible()) {
    <div class="player-content">
      <div class="player-controls">
        <button 
          class="ui-icon-btn ui-icon-btn--white"
          (click)="audio.previous()"
          [disabled]="!audio.hasPrevious()"
          aria-label="Previous verse"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>

        <button 
          class="ui-icon-btn ui-icon-btn--primary play-pause-button"
          (click)="audio.toggle()"
          [attr.aria-label]="audio.isPlaying() ? 'Pause' : 'Play'"
        >
          @if (audio.isPlaying()) {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          }
        </button>

        <button 
          class="ui-icon-btn ui-icon-btn--white"
          (click)="audio.next()"
          [disabled]="!audio.hasNext()"
          aria-label="Next verse"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>

        <button
          type="button"
          class="ui-icon-btn ui-icon-btn--white repeat-button"
          [class.is-on]="audio.repeat() !== 'off'"
          (click)="audio.cycleRepeat()"
          [attr.aria-label]="audio.repeatLabel() + '. Tap to change'"
          [title]="audio.repeatLabel()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 2l4 4-4 4"></path>
            <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
            <path d="M7 22l-4-4 4-4"></path>
            <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
            @if (audio.repeat() === 'ayah') {
              <text x="12" y="15.2" text-anchor="middle" font-size="8.5" font-weight="700" fill="currentColor" stroke="none">1</text>
            }
          </svg>
        </button>

        <span class="time-display">{{ formatTime(audio.currentTime()) }} / {{ formatTime(audio.duration()) }}</span>
      </div>

      <div class="player-progress">
        <input
          type="range"
          class="seek-bar"
          [min]="0"
          [max]="audio.duration() || 0"
          [value]="audio.currentTime()"
          (input)="onSeek($event)"
          [disabled]="!audio.duration()"
          aria-label="Position in the ayah"
        />
      </div>
    </div>
  }
</div>
