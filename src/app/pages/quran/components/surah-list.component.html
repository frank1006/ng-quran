<div class="surah-list-container page-pattern">
  <div class="header-section" [class.searching]="searchOpen()">
    <!-- Title and reciter, with search centred beside them. The search button widens into the
         field across this block (one element, animated sideways only); both lines fade out
         underneath, so nothing moves up or down -->
    <div class="header-top">
      <h1 class="page-title">Quran</h1>

      <div class="header-row">
        <label class="reciter-selector" [attr.inert]="searchOpen() ? '' : null">
          <svg class="reciter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
          <span class="ui-page-subtitle reciter-name">{{ selectedReciterName() }}</span>
          <svg class="reciter-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
          <!-- The real select sits invisibly on top, so the native picker opens -->
          <select
            id="reciter-select"
            class="reciter-select"
            aria-label="Reciter"
            (change)="onReciterChange($event)"
          >
            @if (reciters().length === 0) {
              <option value="">Loading reciters...</option>
            } @else {
              @for (reciter of reciters(); track reciter.id) {
                <option
                  [value]="reciter.id.toString()"
                  [selected]="selectedReciterId() === reciter.id"
                >
                  {{ reciter.name }}
                </option>
              }
            }
          </select>
        </label>
      </div>

      <div class="search-box" [class.open]="searchOpen()">
        <button
          #searchToggle
          type="button"
          class="search-toggle"
          (click)="openSearch()"
          [attr.aria-label]="searchOpen() ? null : 'Search surahs'"
          [attr.aria-hidden]="searchOpen() ? 'true' : null"
          [attr.tabindex]="searchOpen() ? -1 : null"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </button>
        <input
          #searchInput
          type="search"
          class="search-input"
          placeholder="Surah name or number"
          aria-label="Search surahs"
          [attr.tabindex]="searchOpen() ? null : -1"
          [value]="searchQuery()"
          (input)="onSearchChange($event)"
          (keydown.escape)="closeSearch()"
        />
        <button
          type="button"
          class="ui-icon-btn ui-icon-btn--ghost search-close"
          (click)="closeSearch()"
          aria-label="Close search"
          [attr.tabindex]="searchOpen() ? null : -1"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    @if (place(); as p) {
      <!-- The reader's place: tap to open there, the round button listens from it -->
      <div class="continue-card">
        <button type="button" class="continue-text" (click)="continueAt(p.chapter.id, p.verse)" [attr.aria-label]="p.label + ': ' + p.chapter.transliteration + ', ayah ' + p.verse">
          <span class="continue-label">
            @if (p.playing) {
              <span class="listening-bars" aria-hidden="true"><span></span><span></span><span></span></span>
            }
            {{ p.label }}
          </span>
          <span class="continue-names">
            <span class="continue-title">{{ p.chapter.transliteration }}</span>
            <span class="continue-arabic">{{ p.chapter.name }}</span>
          </span>
          <span class="continue-ayah">
            Ayah {{ p.verse }} of {{ p.chapter.total_verses }}
            <svg class="continue-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </span>
          <span class="continue-progress" aria-hidden="true">
            <span class="continue-progress-fill" [style.width.%]="p.percent"></span>
          </span>
        </button>
        <button type="button" class="ui-icon-btn ui-icon-btn--square ui-icon-btn--primary ui-icon-btn--lg continue-go" (click)="listenFromPlace(p.chapter, p.verse)" [attr.aria-label]="p.playing ? 'Pause' : 'Listen from ayah ' + p.verse">
          @if (p.loading) {
            <svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.219-8.56"></path></svg>
          } @else if (p.playing) {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          } @else {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          }
        </button>
      </div>
    }
  </div>

  <div class="surah-scroll" #listContainer>
    @if (loading()) {
      <app-loading-spinner />
    }

    @if (error()) {
      <app-connection-error 
        [errorMessage]="error()!" 
        (retry)="retry()"
      />
    }

    @if (!loading() && !error()) {
      <div class="surah-grid">
        @for (chapter of filteredChapters(); track chapter.id) {
          <button 
            class="surah-card"
            [class.last-opened]="chapter.id === lastSurahId()"
            [attr.data-surah]="chapter.id"
            [attr.aria-current]="chapter.id === lastSurahId() ? 'true' : null"
            (click)="navigateToSurah(chapter.id)"
          >
            <div class="surah-number">{{ chapter.id }}</div>
            <div class="surah-info">
              <div class="surah-names">
                <h3 class="surah-name-latin">{{ chapter.transliteration }}</h3>
                <h4 class="surah-name-arabic">{{ chapter.name }}</h4>
              </div>
              <p class="surah-translation">{{ chapter.translation }}</p>
              <div class="surah-meta">
                <span class="surah-type" [class.surah-type-meccan]="chapter.type === 'Meccan'" [class.surah-type-medinan]="chapter.type === 'Medinan'">{{ chapter.type }}</span>
                <span class="surah-verses">{{ chapter.total_verses }} ayahs</span>
                @if (audio.track()?.chapterId === chapter.id) {
                  <span class="surah-now-playing" [class.paused]="!audio.isPlaying()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"></path>
                    </svg>
                    Ayah {{ audio.track()!.verse }}
                  </span>
                }
              </div>
            </div>
          </button>
        }
      </div>

      @if (filteredChapters().length === 0) {
        <div class="empty-state">
          <p>No surahs found matching your search.</p>
        </div>
      }
    }
  </div>
</div>
