<div class="surah-list-container page-pattern">
  <div class="header-section">
    <h1 class="page-title">Quran</h1>
    
    <div class="reciter-selector">
      <svg class="reciter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Reciter">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
      <select 
        id="reciter-select" 
        class="reciter-select"
        (change)="onReciterChange($event)"
      >
        @if (reciters().length === 0) {
          <option value="">Loading reciters...</option>
        } @else {
          @for (reciter of reciters(); track reciter.id) {
            <option 
              [value]="reciter.id.toString()" 
              [selected]="selectedReciterId() === reciter.id"
            >
              {{ reciter.name }}
            </option>
          }
        }
      </select>
    </div>

    <div class="search-section">
      <div class="search-input-wrapper">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          type="text"
          class="search-input"
          placeholder="Search surah by name or number..."
          [value]="searchQuery()"
          (input)="onSearchChange($event)"
        />
      </div>
    </div>

    @if (nowListening(); as now) {
      <!-- A recitation is loaded: the header card follows it instead of the reading position -->
      <div class="continue-card listening">
        <button type="button" class="continue-text" (click)="continueAt(now.chapter.id, now.verse)" [attr.aria-label]="'Open ' + now.chapter.transliteration + ', ayah ' + now.verse">
          <span class="continue-label">
            @if (audio.isPlaying()) {
              <span class="listening-bars" aria-hidden="true"><span></span><span></span><span></span></span>
              Now listening
            } @else {
              Paused
            }
          </span>
          <span class="continue-names">
            <span class="continue-title">{{ now.chapter.transliteration }}</span>
            <span class="continue-arabic">{{ now.chapter.name }}</span>
          </span>
          <span class="continue-ayah">Ayah {{ now.verse }} of {{ now.chapter.total_verses }} <span class="continue-percent">· {{ now.percent }}%</span></span>
          <span class="continue-progress" aria-hidden="true">
            <span class="continue-progress-fill" [style.width.%]="now.percent"></span>
          </span>
        </button>
        <button type="button" class="continue-go" (click)="audio.toggle()" [attr.aria-label]="audio.isPlaying() ? 'Pause' : 'Play'">
          @if (audio.loadingVerse() !== null) {
            <svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.219-8.56"></path></svg>
          } @else if (audio.isPlaying()) {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          } @else {
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          }
        </button>
      </div>
    } @else if (continueReading(); as cont) {
      <button type="button" class="continue-card" (click)="continueAt(cont.chapter.id, cont.verse)">
        <span class="continue-text">
          <span class="continue-label">Continue reading</span>
          <span class="continue-names">
            <span class="continue-title">{{ cont.chapter.transliteration }}</span>
            <span class="continue-arabic">{{ cont.chapter.name }}</span>
          </span>
          <span class="continue-ayah">Ayah {{ cont.verse }} of {{ cont.chapter.total_verses }} <span class="continue-percent">· {{ cont.percent }}%</span></span>
          <span class="continue-progress" aria-hidden="true">
            <span class="continue-progress-fill" [style.width.%]="cont.percent"></span>
          </span>
        </span>
        <span class="continue-go" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"></path>
          </svg>
        </span>
      </button>
    }
  </div>

  <div class="surah-scroll" #listContainer>
    @if (loading()) {
      <app-loading-spinner />
    }

    @if (error()) {
      <app-connection-error 
        [errorMessage]="error()!" 
        (retry)="retry()"
      />
    }

    @if (!loading() && !error()) {
      <div class="surah-grid">
        @for (chapter of filteredChapters(); track chapter.id) {
          <button 
            class="surah-card"
            [class.last-opened]="chapter.id === lastSurahId()"
            [attr.data-surah]="chapter.id"
            [attr.aria-current]="chapter.id === lastSurahId() ? 'true' : null"
            (click)="navigateToSurah(chapter.id)"
          >
            <div class="surah-number">{{ chapter.id }}</div>
            <div class="surah-info">
              <div class="surah-names">
                <h3 class="surah-name-latin">{{ chapter.transliteration }}</h3>
                <h4 class="surah-name-arabic">{{ chapter.name }}</h4>
              </div>
              <p class="surah-translation">{{ chapter.translation }}</p>
              <div class="surah-meta">
                <span class="surah-type" [class.surah-type-meccan]="chapter.type === 'Meccan'" [class.surah-type-medinan]="chapter.type === 'Medinan'">{{ chapter.type }}</span>
                <span class="surah-verses">{{ chapter.total_verses }} ayahs</span>
                @if (audio.track()?.chapterId === chapter.id) {
                  <span class="surah-now-playing" [class.paused]="!audio.isPlaying()">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                      <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"></path>
                    </svg>
                    Ayah {{ audio.track()!.verse }}
                  </span>
                }
              </div>
            </div>
          </button>
        }
      </div>

      @if (filteredChapters().length === 0) {
        <div class="empty-state">
          <p>No surahs found matching your search.</p>
        </div>
      }
    }
  </div>
</div>
