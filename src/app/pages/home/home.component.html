<app-hero-section
  [currentPrayer]="currentPrayer()"
  [timeUntilNext]="timeUntilNext()"
>
  @if (prayerTrajectory()) {
    <app-prayer-trajectory [trajectoryData]="prayerTrajectory()!" />
  }
</app-hero-section>

<section class="prayers">
  <app-date-header
    [formattedDate]="formattedDate()"
    [hijriDate]="hijriDate()"
    (dateNavigate)="navigateDate($event)"
  />

  <app-prayer-list
    [prayers]="prayers()"
    [loading]="loading()"
    [error]="error()"
    (retry)="loadPrayerTimes()"
  />
</section>
