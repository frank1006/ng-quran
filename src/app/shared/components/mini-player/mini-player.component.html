@if (visible() && audio.track(); as track) {
  @if (expanded()) {
    <div class="player-card" id="quran-player-card" role="dialog" aria-label="Quran player">
      <div class="card-header">
        <button type="button" class="card-info" (click)="openSurah()" [attr.aria-label]="'Open ' + track.chapterName + ', ayah ' + track.verse">
          <span class="card-title">{{ track.chapterName }}</span>
          <span class="card-subtitle">
            Ayah {{ track.verse }} of {{ track.totalVerses }}
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </span>
        </button>
        <button type="button" class="control-button stop-button" (click)="stop()" aria-label="Stop and close player">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></svg>
        </button>
      </div>

      <div class="player-controls">
        <button type="button" class="control-button" (click)="audio.previous()" [disabled]="!audio.hasPrevious()" aria-label="Previous ayah">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>

        <button type="button" class="control-button play-pause-button" (click)="audio.toggle()" [attr.aria-label]="audio.isPlaying() ? 'Pause' : 'Play'">
          @if (audio.loadingVerse() !== null) {
            <svg class="spinner" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 11-6.219-8.56"></path></svg>
          } @else if (audio.isPlaying()) {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          } @else {
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
          }
        </button>

        <button type="button" class="control-button" (click)="audio.next()" [disabled]="!audio.hasNext()" aria-label="Next ayah">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>

      <div class="player-progress">
        <span class="time-display">{{ formatTime(audio.currentTime()) }}</span>
        <input
          type="range"
          class="seek-bar"
          aria-label="Seek"
          [min]="0"
          [max]="audio.duration() || 0"
          [value]="audio.currentTime()"
          (input)="onSeek($event)"
          [disabled]="!audio.duration()"
        />
        <span class="time-display">{{ formatTime(audio.duration()) }}</span>
      </div>
    </div>
  }

  <button
    type="button"
    class="player-fab"
    [class.open]="expanded()"
    (click)="toggleCard()"
    [attr.aria-expanded]="expanded()"
    aria-controls="quran-player-card"
    [attr.aria-label]="(audio.isPlaying() ? 'Reciting ' : 'Paused: ') + track.chapterName + ', ayah ' + track.verse"
  >
    @if (expanded()) {
      <svg class="fab-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    } @else {
      <span class="fab-bars" [class.playing]="audio.isPlaying()" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
    }
  </button>
}
