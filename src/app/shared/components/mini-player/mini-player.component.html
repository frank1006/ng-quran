@if (visible() && audio.track(); as track) {
  <div class="mini-player" role="region" aria-label="Quran player">
    <div class="mini-progress" aria-hidden="true">
      <span class="mini-progress-fill" [style.width.%]="progress()"></span>
    </div>

    <button type="button" class="mini-info" (click)="openSurah()" [attr.aria-label]="'Open ' + track.chapterName + ', ayah ' + track.verse">
      <span class="mini-icon" [class.playing]="audio.isPlaying()" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="mini-text">
        <span class="mini-title">{{ track.chapterName }}</span>
        <span class="mini-subtitle">Ayah {{ track.verse }} of {{ track.totalVerses }}</span>
      </span>
    </button>

    <button
      type="button"
      class="mini-button mini-play"
      (click)="audio.toggle()"
      [attr.aria-label]="audio.isPlaying() ? 'Pause' : 'Play'"
    >
      @if (audio.loadingVerse() !== null) {
        <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M21 12a9 9 0 11-6.219-8.56"></path>
        </svg>
      } @else if (audio.isPlaying()) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"></rect>
          <rect x="14" y="4" width="4" height="16" rx="1"></rect>
        </svg>
      } @else {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"></path>
        </svg>
      }
    </button>

    <button type="button" class="mini-button mini-close" (click)="audio.stop()" aria-label="Stop and close player">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"></path>
      </svg>
    </button>
  </div>
}
