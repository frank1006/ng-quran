<section class="hero-section">
  <div class="hero-background">
    <div class="curve-timeline">
      <svg viewBox="0 0 400 120" preserveAspectRatio="none" class="curve-svg">
        <path d="M 0,100 Q 100,20 200,50 T 400,60 L 400,120 L 0,120 Z"
              fill="url(#gradient1)" opacity="0.3"/>
        <defs>
          <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:var(--color-primary);stop-opacity:0.18" />
            <stop offset="100%" style="stop-color:var(--color-accent);stop-opacity:0.12" />
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

  <div class="hero-content">
    @if (backUrl() || showActionButton()) {
      <div class="header-top">
        @if (backUrl()) {
          <a [routerLink]="backUrl()!" class="back-button" [attr.aria-label]="backLabel()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"></path>
            </svg>
          </a>
        } @else {
          <div></div>
        }

        @if (showActionButton()) {
          <button 
            class="action-button"
            [class.active]="actionButtonActive()"
            (click)="handleActionClick()"
            [attr.aria-label]="actionButtonLabel()"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
          </button>
        } @else {
          <div></div>
        }
      </div>
    }

    <div class="hero-body">
      <ng-content></ng-content>
    </div>
  </div>
</section>
