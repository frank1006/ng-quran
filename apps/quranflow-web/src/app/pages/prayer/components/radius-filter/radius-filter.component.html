<div class="date-header">
  <!-- Empty space for left nav button (maintains layout consistency) -->
  <div></div>

  <div class="date-content">
    <button 
      class="location-badge"
      type="button"
      aria-label="Masjid nearby"
    >
      <span class="today-label">MASJID</span>
      <span class="separator">|</span>
      <svg class="location-icon" width="10" height="10" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#1f1f1f" d="M122,231.3l-24.3-73l-73-24.3c-6.3-2-10.5-4.6-12.8-7.7c-2.3-3.1-2.5-6.4-0.6-9.8c1.8-3.4,5.8-6.4,11.7-9l202.3-94.3c9.1-4,15.3-4.3,18.6-1.1s2.9,9.5-1.1,18.6L148,233c-2.6,6-5.5,9.9-8.7,11.7c-3.3,1.9-6.5,1.6-9.6-0.6C126.5,241.9,124,237.6,122,231.3z"/>
      </svg>
      <span class="location">Nearby</span>
    </button>
    
    <!-- Radius Filter Buttons -->
    <div class="radius-filters">
      @for (option of radiusOptions; track option) {
        <button
          class="radius-filter-button"
          [class.active]="radius() === option"
          type="button"
          (click)="onRadiusChange(option)"
          [disabled]="loading()"
          [attr.aria-pressed]="radius() === option"
          [attr.aria-label]="'Search within ' + option + ' kilometers'"
        >
          {{ option }}km
        </button>
      }
    </div>
  </div>

  <!-- Empty space for right nav button (maintains layout consistency) -->
  <div></div>
</div>
